<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenCluely Chat</title>
  <link href="./src/styles/common.css" rel="stylesheet">
  <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css">
  <style>
    /* Only chat-specific styles here — everything else comes from common.css */
    .chat-container { width: 100%; height: 100vh; display: flex; flex-direction: column; -webkit-app-region: drag; }

    .chat-messages { flex: 1; padding: var(--space-xl); overflow-y: auto; overflow-x: hidden; -webkit-app-region: no-drag; }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .message-time { color: var(--text-muted); font-size: var(--text-xs); margin-bottom: var(--space-xs); font-weight: 500; }
    .message-text { color: var(--text-primary); font-size: var(--text-base); line-height: 1.5; word-wrap: break-word; overflow-wrap: break-word; }

    .chat-input { padding: var(--space-lg) var(--space-xl); border-top: 1px solid rgba(255,255,255,0.08); -webkit-app-region: no-drag; background: rgba(0,0,0,0.2); backdrop-filter: var(--glass-blur-light); flex-shrink: 0; }

    .input-container { display: flex; align-items: center; gap: var(--space-md); background: var(--surface-light); border-radius: var(--glass-radius-sm); padding: var(--space-sm) var(--space-md); border: var(--glass-border); transition: border-color var(--transition-normal); }
    .input-container:focus-within { border-color: var(--color-accent); }

    .input-container textarea { flex: 1; background: transparent; border: none; color: var(--text-primary); font-family: var(--font-ui); font-size: var(--text-base); outline: none; resize: none; line-height: 1.4; min-height: 32px; max-height: 140px; overflow-y: auto; }
    .input-container textarea::placeholder { color: var(--text-muted); }

    .input-btn { background: var(--surface-hover); border: none; border-radius: var(--glass-radius-xs); padding: var(--space-sm); color: var(--text-primary); cursor: pointer; transition: all var(--transition-normal); -webkit-app-region: no-drag; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
    .input-btn:hover { background: var(--surface-medium); }
    .input-btn.recording { background: rgba(255,71,87,0.8); box-shadow: 0 0 15px var(--color-danger-glow); }

    .header-actions { display: flex; gap: var(--space-sm); -webkit-app-region: no-drag; }
    .header-btn { background: var(--surface-medium); border: 1px solid rgba(255,255,255,0.18); color: var(--text-primary); border-radius: var(--glass-radius-xs); padding: var(--space-sm) var(--space-md); cursor: pointer; font-size: var(--text-sm); transition: all var(--transition-normal); }
    .header-btn:hover { background: var(--surface-hover); }
    .header-btn-close:hover { background: rgba(239,68,68,0.25); border-color: rgba(239,68,68,0.45); }

    .listening-area { display: flex; justify-content: center; padding: var(--space-sm) 0; -webkit-app-region: no-drag; }

    .interim-overlay { padding: var(--space-md) var(--space-xl); color: var(--text-secondary); font-size: var(--text-sm); font-style: italic; display: none; border-top: 1px solid rgba(255,255,255,0.05); -webkit-app-region: no-drag; }
    .interim-overlay.active { display: block; animation: fadeIn 0.2s ease-out; }
  </style>
</head>
<body>
  <div class="chat-container glass-container">
    <div class="glass-header">
      <div style="color: var(--text-primary); font-size: var(--text-md); font-weight: 600; display: flex; align-items: center; gap: var(--space-sm); pointer-events: none;">
        <i class="fas fa-comments"></i> OpenCluely
      </div>
      <div class="header-actions">
        <button class="header-btn" id="clearHistoryBtn" title="Clear chat"><i class="fas fa-trash"></i></button>
        <button class="header-btn header-btn-close" id="closeBtn" title="Close"><i class="fas fa-times"></i></button>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="listening-area hidden" id="listeningArea">
      <div class="listening-indicator" id="listeningIndicator">
        <div style="display:flex;align-items:center;gap:2px;">
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
        <span class="listening-text">Listening</span>
        <span class="listening-duration" id="listeningDuration">0s</span>
      </div>
    </div>
    <div class="interim-overlay" id="interimOverlay"></div>
    <div class="chat-input">
      <div class="input-container">
        <textarea placeholder="Type a message... (Shift+Enter for newline)" id="messageInput" rows="1"></textarea>
        <button class="input-btn" id="micButton" title="Voice input"><i class="fas fa-microphone"></i></button>
        <button class="input-btn" id="sendButton" title="Send"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
  <script src="lib/markdown.js"></script>
  <script src="./node_modules/prismjs/prism.min.js"></script>
  <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
  <script>try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}</script>
  <script src="./src/ui/chat-window.js"></script>
</body>
</html>
